services:

  production-postgres:
    image: postgres:17
    container_name: flashcut-postgres

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    volumes:
      - flashcut_prod_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped



  production-redis:
    image: redis:7-alpine
    container_name: flashcut-redis

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  production-api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: flashcut-api

    user: "${LOCAL_CONTAINER_USER:?Set LOCAL_CONTAINER_USER in .env}"

    ports:
      - "5002:5001"

    env_file:
      - .env

    environment:
      APP_ENV: local
      APP_VERSION: 1.0.0
      AUTH_DISABLED: "true"

      RATE_LIMIT_ENABLED: "true"
      REDIS_URL: redis://production-redis:6379/0
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-127.0.0.1,localhost,production-api}"

      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"

      AWS_PROFILE: "${AWS_PROFILE:?Set AWS_PROFILE in .env}"
      HOME: /tmp/flashcut-home
      AWS_CONFIG_FILE: /tmp/flashcut-home/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /tmp/flashcut-home/.aws/credentials

    volumes:
      - ${HOME}/.aws/config:/tmp/flashcut-home/.aws/config:ro
      - ${HOME}/.aws/credentials:/tmp/flashcut-home/.aws/credentials:ro
      - ${HOME}/.aws/login/cache:/tmp/flashcut-home/.aws/login/cache
      - ${HOME}/.aws/sso/cache:/tmp/flashcut-home/.aws/sso/cache

    depends_on:
      production-postgres:
        condition: service_healthy

      production-redis:
        condition: service_healthy

    command:
      - sh
      - -c
      - >
        alembic -c /app/alembic.ini upgrade head &&
        exec uvicorn app.main:app
        --host 0.0.0.0
        --port 5001
        --no-access-log

    restart: unless-stopped


  production-summary-worker:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: flashcut-summary-worker

    user: "${LOCAL_CONTAINER_USER:?Set LOCAL_CONTAINER_USER in .env}"

    env_file:
      - .env

    environment:
      APP_ENV: local
      APP_VERSION: 1.0.0
      AUTH_DISABLED: "true"

      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"

      AWS_PROFILE: "${AWS_PROFILE:?Set AWS_PROFILE in .env}"
      HOME: /tmp/flashcut-home
      AWS_CONFIG_FILE: /tmp/flashcut-home/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /tmp/flashcut-home/.aws/credentials

    volumes:
      - ${HOME}/.aws/config:/tmp/flashcut-home/.aws/config:ro
      - ${HOME}/.aws/credentials:/tmp/flashcut-home/.aws/credentials:ro
      - ${HOME}/.aws/login/cache:/tmp/flashcut-home/.aws/login/cache
      - ${HOME}/.aws/sso/cache:/tmp/flashcut-home/.aws/sso/cache

    depends_on:
      production-api:
        condition: service_healthy

    command:
      - python
      - -m
      - app.workers.summary_worker

    healthcheck:
      disable: true

    restart: unless-stopped


